name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────
  # Frontend checks: lint, typecheck, tests, build
  # ───────────────────────────────────────────────
  frontend-check:
    name: Frontend Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install frontend dependencies
        # Scoped to the app: the landing (landing/) is a separate package with
        # its own toolchain and must not affect the app build or the audit.
        run: pnpm install --frozen-lockfile --filter rl-stats

      - name: Run TypeScript check
        run: pnpm exec tsc --noEmit

      - name: Run ESLint
        run: pnpm lint

      - name: Run frontend tests
        run: pnpm vitest run --coverage

      - name: Build frontend
        run: pnpm build

      - name: Upload frontend build artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.run_id }}
          path: dist/
          retention-days: 3

  # ───────────────────────────────────────────────
  # Rust checks: check, test, clippy, fmt
  # ───────────────────────────────────────────────
  rust-check:
    name: Rust Check
    runs-on: windows-latest
    # The suite needs ~13 min plus the target-cache upload; 20 minutes
    # cancelled the job mid-post-step even after all tests passed.
    timeout-minutes: 45

    defaults:
      run:
        working-directory: src-tauri

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          # Only the downloaded crates + index: caching the extracted
          # ~/.cargo/registry/src (thousands of small files) made every cache
          # save take ~4.5 minutes on Windows.
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
          # No lockfile hash: a version bump changed it and re-downloaded the
          # whole registry. run_id + prefix restore keeps it warm.
          key: ${{ runner.os }}-cargo-registry-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache Cargo target
        uses: actions/cache@v4
        with:
          path: src-tauri/target
          # No lockfile hash (see release.yml): version bumps change Cargo.lock
          # on every release and wiped the whole dependency cache.
          key: ${{ runner.os }}-cargo-target-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-

      - name: Run cargo check
        run: cargo check --all-targets --all-features

      # The tauri test harness (commands_integration) fails to LOAD on the
      # runner with STATUS_ENTRYPOINT_NOT_FOUND (0xc0000139) before executing
      # a single test — same failure on the pre-2.16.0 commits, and copying
      # the Edge WebView2 loader next to the binary did not change it. It is
      # an environment/loader issue, not a test assertion. Run the rest of
      # the suite here and keep the harness for local runs (it passes on all
      # development machines).
      - name: Run cargo test (Windows subset)
        if: runner.os == 'Windows'
        run: |
          cargo test --all-features --lib
          cargo test --all-features --test integration_test --test overlay_server

      - name: Run cargo test (full)
        if: runner.os != 'Windows'
        run: cargo test --all-targets --all-features

      - name: Run cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Upload Cargo build artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-build-${{ github.run_id }}
          path: src-tauri/target/
          retention-days: 3

  # ───────────────────────────────────────────────
  # Warm the release-profile cache for the tag that follows a release commit.
  #
  # GitHub scopes Actions caches per ref: a cache saved by a tag run is only
  # visible to that same tag, so every release was a cold ~15 minute build.
  # Caches saved on the default branch ARE visible to tag runs, so this job
  # compiles the release profile on the version-bump commit (message starts
  # with "chore(release)") and the tag run only has to bundle and sign.
  # ───────────────────────────────────────────────
  release-prebuild:
    name: Prebuild Release Cache
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'chore(release)')
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache Cargo target (release)
        uses: actions/cache@v4
        with:
          path: src-tauri/target
          key: ${{ runner.os }}-cargo-release-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: Install frontend dependencies
        # Scoped to the app: the landing (landing/) is a separate package with
        # its own toolchain and must not affect the app build or the audit.
        run: pnpm install --frozen-lockfile --filter rl-stats

      - name: Build release profile (no bundles)
        run: pnpm tauri build --no-bundle
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

  # ───────────────────────────────────────────────
  # Secret scanning: fail the build on committed keys
  # ───────────────────────────────────────────────
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ───────────────────────────────────────────────
  # Dependency audit: advisory only, never blocks
  # ───────────────────────────────────────────────
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: Install frontend dependencies
        # Scoped to the app: the landing (landing/) is a separate package with
        # its own toolchain and must not affect the app build or the audit.
        run: pnpm install --frozen-lockfile --filter rl-stats

      - name: pnpm audit
        run: pnpm audit --audit-level high

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: cargo audit
        working-directory: src-tauri
        run: cargo audit
