name: CI

on:
  push:
    branches: [main, develop]
    # `paths-ignore` y no un whitelist: `secret-scan` también vive acá y tiene
    # que ver todos los pushes de código. Lo que se filtra es solo lo que no
    # puede contener un secreto ni romper un chequeo: documentación y plantillas
    # de issues. El ahorro grande está en `rust.yml`, que sí filtra
    # `src-tauri/**` porque es el job de 11 minutos en Windows.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'landing/**'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'landing/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────
  # Todo el gate de frontend en un solo job: lint, typecheck, tests, build,
  # escaneo de secretos y auditoría de dependencias JavaScript.
  #
  # GitHub redondea al minuto POR JOB y cada job paga su propio runner,
  # checkout y setup. `secret-scan` (9s) y `dependency-audit` (18s) costaban un
  # minuto cada uno por separado; acá van como pasos del mismo job, que ya
  # tiene Node, pnpm y las dependencias instaladas.
  #
  # `dependency-audit` era `continue-on-error` a nivel de job (advisory), así
  # que sus pasos llevan el flag para conservar ese comportamiento.
  # ───────────────────────────────────────────────
  gate:
    name: Frontend, secretos y dependencias
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # gitleaks lee los PRs para comentar los hallazgos: sin este permiso el
    # paso falla en pull_request aunque el escaneo en sí no lo necesite.
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        # Historial completo para que gitleaks vea todos los commits, no solo
        # el último: un secreto agregado en un commit anterior debe aparecer.
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install frontend dependencies
        # El typecheck, los tests y el build consumen las dependencias del
        # workspace principal; landing tiene su propio workflow y queda fuera.
        run: pnpm install --frozen-lockfile --filter rl-stats


      - name: Run TypeScript check
        run: pnpm exec tsc --noEmit

      - name: Run ESLint
        run: pnpm lint

      - name: Run frontend tests
        run: pnpm vitest run --coverage

      - name: Build frontend
        run: pnpm build

      - name: Upload frontend build artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist-${{ github.run_id }}
          path: dist/
          retention-days: 3

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Advisory: nunca frena. `continue-on-error` por paso porque el job ahora
      # es el gate real y un aviso de dependencia no debe taparlo.
      - name: pnpm audit
        continue-on-error: true
        run: pnpm audit --audit-level high
