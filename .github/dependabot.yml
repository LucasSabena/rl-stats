version: 2

updates:
  # npm / pnpm dependencies
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
      day: 'monday'
      time: '09:00'
    # Un PR por mes, no diez. Cada PR dispara el CI (que corre el job de Rust en
    # Windows, ~11 min); con grupos incompletos quedaban fuera del grupo
    # `react-hook-form`, `zustand`, `zod`, `@tanstack/react-query`,
    # `@hookform/resolvers`, `react-i18next`, `react-router-dom` y
    # `eslint-plugin-react-refresh`, y cada uno abría su propio PR. Llegaron a
    # acumularse 73 PRs abiertos. El catch-all `todos` los junta.
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    ignore:
      - dependency-name: 'recharts'
        update-types: ['version-update:semver-major']
      - dependency-name: 'lucide-react'
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitejs/plugin-react'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint-plugin-react-hooks'
        update-types: ['version-update:semver-major']
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint-plugin-react-refresh'
        update-types: ['version-update:semver-major']
      # Vitest 5 cambia la API de configuración y los tests fallan; el salto
      # hay que hacerlo a mano. Sin esto, Dependabot mantenía un PR abierto
      # desde el 11/09 que fallaba en cada push a main y gastaba CI en Windows.
      - dependency-name: 'vitest'
        update-types: ['version-update:semver-major']
    reviewers:
      - 'LucasSabena'
    assignees:
      - 'LucasSabena'
    labels:
      - 'dependencies'
      - 'javascript'
    commit-message:
      prefix: 'deps'
      include: 'scope'
    groups:
      # Catch-all: todo lo que no caiga en un grupo con nombre va acá, así el
      # update mensual es un solo PR y un solo CI.
      todos:
        patterns:
          - '*'
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react*'
      tauri:
        patterns:
          - '@tauri-apps/*'
          - 'tauri-plugin-*'
      testing:
        patterns:
          - 'vitest'
          - '@testing-library/*'
          - 'jsdom'
          - 'playwright'

  # Cargo / Rust dependencies
  - package-ecosystem: 'cargo'
    directory: '/src-tauri'
    schedule:
      interval: 'monthly'
      day: 'monday'
      time: '09:00'
    open-pull-requests-limit: 5
    reviewers:
      - 'LucasSabena'
    assignees:
      - 'LucasSabena'
    labels:
      - 'dependencies'
      - 'rust'
    commit-message:
      prefix: 'deps'
      include: 'scope'
    groups:
      # Catch-all: un solo PR y un solo CI por mes.
      todos:
        patterns:
          - '*'
      tauri-rust:
        patterns:
          - 'tauri*'

  # GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
      day: 'monday'
      time: '09:00'
    open-pull-requests-limit: 5
    reviewers:
      - 'LucasSabena'
    assignees:
      - 'LucasSabena'
    labels:
      - 'dependencies'
      - 'github-actions'
    commit-message:
      prefix: 'ci'
      include: 'scope'
