version: 2

updates:
  # npm / pnpm dependencies
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
      day: 'monday'
      time: '09:00'
    # Un único PR agrupado: cada PR dispara el CI y no queremos que una
    # actualización mensual vuelva a abrir una batería de corridas.
    open-pull-requests-limit: 1
    versioning-strategy: increase-if-necessary
    ignore:
      - dependency-name: 'recharts'
        update-types: ['version-update:semver-major']
      - dependency-name: 'lucide-react'
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitejs/plugin-react'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint-plugin-react-hooks'
        update-types: ['version-update:semver-major']
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint-plugin-react-refresh'
        update-types: ['version-update:semver-major']
      # Vitest 5 cambia la API de configuración y los tests fallan; el salto
      # hay que hacerlo a mano. Sin esto, Dependabot mantenía un PR abierto
      # desde el 11/09 que fallaba en cada push a main y gastaba CI en Windows.
      - dependency-name: 'vitest'
        update-types: ['version-update:semver-major']
    reviewers:
      - 'LucasSabena'
    assignees:
      - 'LucasSabena'
    labels:
      - 'dependencies'
      - 'javascript'
    commit-message:
      prefix: 'deps'
      include: 'scope'
    groups:
      monthly:
        patterns:
          - '*'

  # Cargo / Rust dependencies
  - package-ecosystem: 'cargo'
    directory: '/src-tauri'
    schedule:
      interval: 'monthly'
      day: 'monday'
      time: '09:00'
    open-pull-requests-limit: 1
    reviewers:
      - 'LucasSabena'
    assignees:
      - 'LucasSabena'
    labels:
      - 'dependencies'
      - 'rust'
    commit-message:
      prefix: 'deps'
      include: 'scope'
    groups:
      monthly:
        patterns:
          - '*'

  # GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
      day: 'monday'
      time: '09:00'
    open-pull-requests-limit: 1
    reviewers:
      - 'LucasSabena'
    assignees:
      - 'LucasSabena'
    labels:
      - 'dependencies'
      - 'github-actions'
    commit-message:
      prefix: 'ci'
      include: 'scope'
