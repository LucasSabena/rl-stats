<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0d" />

    <!-- Primary -->
    <title>RL Stats — Tu compañero local para Rocket League</title>
    <meta
      name="description"
      content="MMR en vivo de todos los jugadores, overlays para OBS, historial completo y análisis de tu rendimiento. 100% gratis, 100% local, sin cuentas ni telemetría."
    />
    <!-- `index, follow` plus explicit snippet limits: the copy is written to
         work as a search result, so let engines use it fully. -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <meta name="author" content="Lucas Sabena" />
    <meta
      name="keywords"
      content="Rocket League, MMR, rank tracker, OBS overlay, estadísticas, analytics, local, gratis, Windows, companion app"
    />

    <!-- Canonical. The page ships one document in three languages selected by
         ?lang=; the Spanish version is canonical for the root. -->
    <link rel="canonical" href="https://rl-stats.pages.dev/" />
    <link rel="alternate" hreflang="es" href="https://rl-stats.pages.dev/" />
    <link rel="alternate" hreflang="en" href="https://rl-stats.pages.dev/?lang=en" />
    <link rel="alternate" hreflang="pt" href="https://rl-stats.pages.dev/?lang=pt" />
    <link rel="alternate" hreflang="x-default" href="https://rl-stats.pages.dev/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RL Stats" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:locale:alternate" content="pt_BR" />
    <meta property="og:url" content="https://rl-stats.pages.dev/" />
    <meta property="og:title" content="RL Stats — Tu compañero local para Rocket League" />
    <meta
      property="og:description"
      content="MMR en vivo, overlays para OBS, historial y análisis. Gratis, local y sin cuentas."
    />
    <meta property="og:image" content="https://rl-stats.pages.dev/media/social/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Panel en vivo de RL Stats con marcador, MMR de los jugadores y promedio por equipo"
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RL Stats — Tu compañero local para Rocket League" />
    <meta
      name="twitter:description"
      content="MMR en vivo, overlays para OBS, historial y análisis. Gratis, local y sin cuentas."
    />
    <meta name="twitter:image" content="https://rl-stats.pages.dev/media/social/og.png" />

    <!-- Icons -->
    <link rel="icon" type="image/png" href="./brand/logo-64.png" />
    <link rel="apple-touch-icon" href="./brand/logo-128.png" />

    <!-- Structured data: this is a free Windows desktop app, so `SoftwareApplication`
         describes it more accurately (and gives Google the price) than a plain
         WebSite node. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "RL Stats",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Windows 10, Windows 11",
        "processorRequirements": "x64",
        "description": "Compañero de escritorio local para Rocket League: MMR en vivo de todos los jugadores del lobby, overlays para OBS, historial de partidas, análisis de rendimiento y seguimiento de ánimo post-partida. Gratis, local y sin cuentas.",
        "url": "https://rl-stats.pages.dev/",
        "downloadUrl": "https://github.com/LucasSabena/rl-stats/releases/latest",
        "softwareVersion": "2.16.5",
        "license": "https://opensource.org/licenses/MIT",
        "isAccessibleForFree": true,
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "author": {
          "@type": "Person",
          "name": "Lucas Sabena"
        },
        "codeRepository": "https://github.com/LucasSabena/rl-stats",
        "screenshot": "https://rl-stats.pages.dev/media/screens/01-live.webp",
        "featureList": [
          "MMR en vivo de todos los jugadores del lobby",
          "Seis overlays para OBS con SDK para overlays propios",
          "Historial de partidas con goles, asistencias y velocidad del remate",
          "Análisis de rendimiento, punto de quiebre de fatiga y mapa semanal",
          "Seguimiento de ánimo post-partida cruzado con win rate",
          "Datos 100% locales, sin cuentas ni telemetría"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
